{% extends "base.html" %}
{% block title %}Edit note | Notes Manager{% endblock %}
{% block content %}
  <div class="card">
    <h1 id="edit-title">Edit note</h1>
    <form method="POST" id="edit-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="edit-title-input">Title</label>
        <input type="text" id="edit-title-input" name="title" value="{{ note.title }}" maxlength="100" required>
      </div>
      <div class="field">
        <label for="edit-content-input">Content</label>
        <textarea id="edit-content-input" name="content" maxlength="2000">{{ note.content }}</textarea>
      </div>
      <div class="row">
        <div>
          <label for="edit-category">Category</label>
          <select id="edit-category" name="category">
            {% for c in categories %}<option value="{{ c }}" {% if note.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="edit-priority">Priority</label>
          <select id="edit-priority" name="priority">
            {% for p in priorities %}<option value="{{ p }}" {% if note.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
          </select>
        </div>
        <div class="shrink"><button type="submit" id="save-btn">Save</button></div>
        <div class="shrink"><a href="{{ url_for('notes.index') }}" class="btn btn-light" id="cancel-link">Cancel</a></div>
      </div>
    </form>
  </div>
{% endblock %}
