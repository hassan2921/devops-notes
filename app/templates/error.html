{% extends "base.html" %}
{% block title %}Error {{ code }} | Notes Manager{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
  <div class="card center">
    <h1 id="error-code">{{ code }}</h1>
    <p id="error-message">{{ message }}</p>
    <a href="{{ url_for('notes.index') }}" class="btn">Back to my notes</a>
  </div>
{% endblock %}
