{% extends "base.html" %}
{% block title %}Log in | Notes Manager{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
  <div class="card">
    <h1 id="page-title">Log in</h1>
    <form method="POST" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" id="login-btn">Log in</button>
    </form>
    <p>No account? <a href="{{ url_for('auth.register') }}" id="register-link">Create one</a></p>
  </div>
{% endblock %}
