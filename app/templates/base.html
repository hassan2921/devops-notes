<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Notes Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('notes.index') }}" class="brand">Notes Manager</a>
    {% if g.user %}
      <div class="user">
        <span id="nav-user">Hi, {{ g.user.username }}</span>
        <form action="{{ url_for('auth.logout') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" id="logout-btn" class="btn-small">Log out</button>
        </form>
      </div>
    {% endif %}
  </header>

  <main class="container {% block container_class %}{% endblock %}">
    <div id="flashes">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
