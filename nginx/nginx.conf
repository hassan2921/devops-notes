# Nginx reverse proxy: the only container exposed to the outside (port 80).
# It forwards every request to the Flask/Gunicorn container on the private network.

upstream flask_app {
    server web:5000;          # "web" = Compose service name (Docker DNS)
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location / {
        proxy_pass         http://flask_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ALB health checks hit this often; don't fill the logs with them
    location = /health {
        access_log off;
        proxy_pass http://flask_app;
    }
}
